<div class="register-wrapper">

  <div class="register-card">

    <div class="register-header">
      <div class="register-logo">✦</div>
      <h2 class="register-title">Crea tu cuenta</h2>
      <p class="register-subtitle">Empieza a convertir imágenes en código hoy</p>
    </div>

    <form class="register-form">

      <div class="input-group">
        <label for="name">Nombre completo</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="name" placeholder="Tu nombre" />
        </div>
      </div>

      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <div class="input-wrapper">
          <span class="input-icon">✉</span>
          <input type="email" id="email" placeholder="tu@correo.com" />
        </div>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" placeholder="Mínimo 8 caracteres" />
        </div>
      </div>

      <button type="submit" class="submit-btn">
        <span>Crear cuenta</span>
        <span class="btn-arrow">→</span>
      </button>

    </form>

    <p class="login-link">
      ¿Ya tienes cuenta? <a routerLink="/Login">Inicia sesión</a>
    </p>

  </div>

  <div class="register-bg-orb orb-1"></div>
  <div class="register-bg-orb orb-2"></div>

</div>

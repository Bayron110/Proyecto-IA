<div class="login-wrapper">

  <div class="login-card">

    <div class="login-header">
      <div class="login-logo">✦</div>
      <h2 class="login-title">Bienvenido de nuevo</h2>
      <p class="login-subtitle">Inicia sesión para continuar generando</p>
    </div>

    <!-- 🔥 Conectar formulario -->
    <form class="login-form" (ngSubmit)="login()">

      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <div class="input-wrapper">
          <span class="input-icon">✉</span>
          <input 
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="tu@correo.com"
            required />
        </div>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input 
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            required />
        </div>
      </div>

      <div class="form-footer-row">
        <label class="remember-me">
          <input type="checkbox" />
          <span>Recordarme</span>
        </label>
        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="submit-btn">
        <span>Ingresar</span>
        <span class="btn-arrow">→</span>
      </button>

    </form>

    <p class="register-link">
      ¿No tienes cuenta? <a routerLink="/Registro">Regístrate gratis</a>
    </p>

  </div>

  <div class="login-bg-orb orb-1"></div>
  <div class="login-bg-orb orb-2"></div>

</div>

<div class="chat-wrapper">

  <main class="chat-main">

    <!-- MENSAJES -->
    <div class="chat-messages">

      <!-- Estado inicial -->
      <div *ngIf="messages.length === 0" class="welcome-state">
        <h2>Sube tu Imagen</h2>
        <p>La IA convertirá tu diseño en código HTML.</p>
      </div>

      <!-- Mensajes dinámicos -->
      <div 
        *ngFor="let msg of messages"
        class="msg-row"
        [ngClass]="{
          'user-row': msg.role === 'user',
          'bot-row': msg.role === 'bot'
        }"
      >

        <div *ngIf="msg.role === 'bot'" class="avatar bot-avatar">✦</div>

        <div 
          class="msg-bubble"
          [ngClass]="{
            'user-bubble': msg.role === 'user',
            'bot-bubble': msg.role === 'bot'
          }"
        >
          <pre class="msg-text">{{ msg.content }}</pre>
        </div>

        <div *ngIf="msg.role === 'user'" class="avatar user-avatar">U</div>

      </div>

    </div>

    <!-- INPUT AREA -->
    <div class="chat-input-area">

      <!-- Preview -->
      <div *ngIf="selectedImage" class="attached-preview">
        <img [src]="imagePreview" width="80" />
        <span>{{ selectedImage?.name }}</span>
        <button (click)="removeImage()">×</button>
      </div>

      <div class="input-box">

        <label for="file-upload" class="upload-btn">
          📎 Subir Imagen
        </label>

        <input
          id="file-upload"
          type="file"
          accept="image/*"
          hidden
          (change)="onFileSelected($event)"
        />

        <button 
          class="send-btn"
          (click)="sendImage()"
          [disabled]="!selectedImage">
          Enviar
        </button>

      </div>

    </div>

  </main>
</div>
